# M4 自動微調 Agent 設定範例 (設計文件 §7)
# 用法: python -m agent.auto_finetune --config agent/config.example.yaml
data_path: ./data/5_fold_PAPILA/PAPILA_seed42_fold0
task:
  type: classification
task_template: fundus_classification      # 下游任務起點 (§5.8)
experiment_name: null                     # null -> run_YYYYmmdd_HHMMSS

eval:
  primary_metric: score                   # 迴圈最佳化目標 (score = (f1+roc_auc+kappa)/3)
  report_metrics: [accuracy, f1, roc_auc, kappa]
  aggregation: single                     # single | mean_std (多 fold, P5)

loop:
  max_trials: 12                           # 全域 trial 總數上限 (= 樹搜尋總輪數)
  # StopPolicy: 完成 ≥ min_trials 且連續 patience 輪 improve/resume 無提升才停
  # (draft/debug 是探索/修復, 不計入 patience; 另有 max_trials/時間預算/使用者中斷)
  min_trials: 6                            # 至少完成這麼多輪才允許 patience 提早停
  patience: 4                              # 連續無提升的「改良嘗試」輪數
  min_delta: 0.0                           # 視為「有提升」的最小 primary 增幅
  # 全域 AIDE 式樹搜尋 (參考 wecoai/aideml): 單一解答樹, draft 跨 encoder
  num_drafts: 3                            # 起手 draft 數 (輪流各 encoder; 同 encoder 換 preset)
  debug_prob: 0.5                          # 每輪以此機率優先除錯失敗的 leaf
  max_debug_depth: 2                       # 連續除錯鏈上限 (超過就放棄該分支)
  improve_temperature: 0.2                 # 依指標抽樣選改善起點的 softmax 溫度; <=0 = greedy
  # policy 選完節點後, 讓決策層 (LLM) 有改選的機會 — 討論/【QA 結論】要求換 encoder、
  # 開新 draft、回頭改某個節點時, 這是唯一能落實的地方 (改良階段只能在已選定的節點上變異)。
  # 每輪多一次 LLM 呼叫; advisor=heuristic 一律沿用 policy。改選會驗證合法性。
  select_override: true
  # 繼續訓練策略: 選中節點 curve 未收斂 → 從其 checkpoint 續訓 (--resume + --more_epochs)
  resume_unconverged: true                 # 開/關此策略
  resume_epochs: 20                        # 每次續訓多跑的 epoch 數
  max_resumes: 2                           # 同一分支連續續訓上限
  resume_prob: 0.5                         # 符合條件時以此機率選 resume (其餘給 improve)
  max_failed_resumes: 2                    # 全 run 連續無提升的 resume 達此數 → 停用 resume

advisor:
  type: llm                                # llm (預設) | heuristic | skill; 無 SDK/金鑰時自動退回 heuristic
  model: claude-opus-4-8                   # type=llm 時使用
  preset: default                          # default | paper | mae 冷啟動超參起點
  guidance: ""                             # 引導方向 (LLM 決策 prompt); web 上也可即時討論
  allow_code_edit: false                   # 允許 LLM 修改訓練程式 (debug 階段);
                                           # 修改版隔離在 <run_dir>/src/ 執行, 原始程式不動

privacy:                                   # 資料圍欄 — docs/data_firewall_design.md
  # LLM 永遠看不到影像、檔名、路徑與真實類別名。mode 是巨集, 載入時會覆寫下面的個別
  # 欄位, 讓「strict 卻同時開 allow_code_edit」這種組合不可能成立。
  mode: strict                             # strict (預設) | standard | off
  #   strict   — 資料集/類別假名化; 只回饋結構化 ErrorFacts; **強制** allow_code_edit=false
  #              (允許改程式 + 回饋 log = 一條完整的資料讀取通道)
  #   standard — 保留程式修改權, 但原始 log 仍不回饋; 類別名需使用者逐一授權
  #   off      — 關閉圍欄 (不建議; web UI 會常駐紅色警示)
  dataset_alias: true                      # 資料集路徑/名稱以假名 DS-xxxxxx 表示
  class_names: hashed                      # hashed | user_approved | plain
  revealed_classes: []                     # class_names=user_approved 時使用者勾選的類別名
  log_feedback: structured                 # none | structured | raw (raw 僅 mode=off 可用)
  ask_user_when_unsure: true               # 允許決策層提問請使用者回答 (管道 B)
  allow_free_text_questions: false         # 是否允許自由文字題 (strict 下強制 false)
  egress_audit: true                       # 每次外送落地 runs/<run>/privacy_audit.jsonl
  guard_on_user_input: warn                # warn | block | off — 使用者自願貼上的內容
  salt_file: null                          # 假名 HMAC salt; null = ~/.medclaw/privacy_salt
  expensive_analyzers_need_consent: true   # near_dup 這類高成本分析需使用者同意
  scan_filenames: true                     # 出口掃描是否納入抽樣檔名主幹

budget:
  max_wall_clock_min: null                 # 時間預算護欄 (分鐘)
  max_llm_tokens: null

gpu:                                       # GPU 利用率最佳化 (訓練期間 nvidia-smi 取樣)
  optimize: true                           # 利用率太低時自動調整後續 recipe
  util_target: 60.0                        # 平均利用率低於此 (%) 視為太低
  sample_interval_s: 5.0                   # 取樣間隔 (秒)
  mem_target: 0.85                         # 加大 batch 後記憶體峰值上限 (佔總量比例)
  max_batch_size: 256                      # batch 上限
  max_num_workers: 16                      # dataloader worker 上限 (自動 clamp 到每 epoch iters)
  cache_auto: true                         # 高解析度資料集自動啟用預縮圖快取 (run 起手決定)
  cache_short_side: 512                    # 快取短邊 (原圖中位短邊 ≥ 1.5×此值才啟用)

ensemble:                                  # 收尾集成 (docs/ensemble_design.md 方案 A)
  # 樹搜尋停止後, 把多個已訓練 trial 以機率軟投票組成 ensemble; 重用各 trial 已落地的
  # predictions_*.csv, 不重訓、不需 GPU。勝過最佳單模型才採用為交付。
  enabled: true
  method: val_weighted                     # equal (等權) | val_weighted (依 val 求權重) | stacking (val 上訓練 meta-learner)
  llm_select: false                        # 成員選擇是否用 LLM (獨立於 advisor.type); false=規則式選擇, 環境不可用會自動退回
  min_members: 2                           # 至少幾個成員才組
  max_members: 4                           # 最多納入幾個 (過多攤薄強成員)
  member_delta: 0.05                       # 成員門檻: primary ≥ 最佳單模型 − 此值
  require_diverse_encoders: true           # 優先涵蓋不同 encoder (去相關)
  # 方案 B: 搜尋『中』的 ensemble stage — 改良進入平坦期即中途組 ensemble, 隨池成長重試
  in_search: false                         # 開/關方案 B (預設僅收尾集成 = 方案 A)
  search_patience: 2                       # 連續無提升改良輪數達此值 → 觸發一次搜尋中集成
  max_search_ensembles: 3                  # 全 run 搜尋中集成次數上限

device: 0
dry_run: false
